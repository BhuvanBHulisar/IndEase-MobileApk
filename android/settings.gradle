pluginManagement {
    def flutterSdkPath = {
        def properties = new java.util.Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null || sdkPath.isEmpty()) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }
        if (sdkPath == null || sdkPath.isEmpty()) {
            throw new org.gradle.api.GradleException(
                "Flutter SDK not found. Set flutter.sdk in android/local.properties or FLUTTER_ROOT."
            )
        }
        return sdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

rootProject.name = "indease_consumer"
include ":app"
