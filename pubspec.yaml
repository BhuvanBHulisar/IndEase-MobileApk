name: indease_consumer
description: IndEase consumer app built with Flutter and mock data only.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.1
  
  # HTTP
  http: ^1.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Socket.IO
  socket_io_client: ^2.0.3+1
  
  # File handling
  image_picker: ^1.0.7
  file_picker: ^8.0.3
  path: ^1.9.0
  
  # Navigation
  go_router: ^13.0.0
  
  # State
  provider: ^6.1.1
  
  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  
  # Payments
  razorpay_flutter: ^1.3.6
  
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00685F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
