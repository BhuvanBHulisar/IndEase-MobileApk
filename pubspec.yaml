name: indease_consumer
description: IndEase consumer app built with Flutter and mock data only.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.0.0
  provider: ^6.1.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00685F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
